<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for Android icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern representing technical telemetry -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.3">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Extruder Barrel & Die Graphic -->
  <g transform="translate(48, 80)">
    <!-- Hopper / Tolva -->
    <path d="M 80 60 L 150 60 L 130 140 L 100 140 Z" fill="#38bdf8" opacity="0.9" />
    <ellipse cx="115" cy="60" rx="35" ry="10" fill="#7dd3fc" />

    <!-- Barrel / Cilindro principal con zonas térmicas -->
    <rect x="70" y="140" width="220" height="90" rx="8" fill="url(#barrelGrad)" stroke="#1e293b" stroke-width="4" />

    <!-- Heat band zones (resistencias calefactoras) -->
    <rect x="85" y="132" width="35" height="106" rx="4" fill="#f97316" opacity="0.85" />
    <rect x="135" y="132" width="35" height="106" rx="4" fill="#fb923c" opacity="0.85" />
    <rect x="185" y="132" width="35" height="106" rx="4" fill="#f97316" opacity="0.85" />
    <rect x="235" y="132" width="35" height="106" rx="4" fill="#ea580c" opacity="0.9" />

    <!-- Screw indication (husillo extrusion) -->
    <path d="M 80 185 Q 120 165 160 185 T 240 185 T 285 185" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Die / Cabezal de extrusión con salida cónica -->
    <path d="M 290 155 L 340 170 L 340 200 L 290 215 Z" fill="#cbd5e1" stroke="#334155" stroke-width="3" />

    <!-- Extruded Profile / Material extruido saliendo fluido -->
    <path d="M 340 180 L 400 180 L 415 185 L 400 190 L 340 190 Z" fill="#38bdf8" filter="url(#glow)" />
    
    <!-- Pressure gauge / Manómetro digital de presión de masa -->
    <circle cx="280" cy="100" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <line x1="280" y1="132" x2="280" y2="140" stroke="#38bdf8" stroke-width="4" />
    <path d="M 268 95 A 14 14 0 0 1 292 95" fill="none" stroke="#f97316" stroke-width="3" />
    <line x1="280" y1="100" x2="292" y2="88" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Lower Branding and Status Badges -->
  <text x="256" y="390" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="3">EXTRUDATA</text>
  <text x="256" y="425" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="4">SISTEMA ANDROID INDUSTRIAL</text>

  <!-- Pulse dots -->
  <circle cx="160" cy="450" r="4" fill="#22c55e" />
  <text x="175" y="454" fill="#94a3b8" font-family="monospace" font-size="14">EN LÍNEA</text>
  <circle cx="280" cy="450" r="4" fill="#38bdf8" />
  <text x="295" y="454" fill="#94a3b8" font-family="monospace" font-size="14">TELEMETRÍA</text>
</svg>
